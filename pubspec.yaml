name: bms_front_end
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.0
  get: ^4.6.6
  dotted_border: ^2.1.0
  flutter_expanded_tile: ^0.4.0
  expansion_tile_group: ^2.1.0
  data_table_2: ^2.5.15
  go_router: ^14.2.8
  get_it: ^8.0.0
  animated_tree_view: ^2.3.0
  percent_indicator: ^4.2.3
  readmore: ^3.0.0
  flutter_layout_grid: ^2.0.7
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/image/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
