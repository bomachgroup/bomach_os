name: bms_front_end
description: "Bomach OS."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  fl_chart: ^0.71.0
  dotted_border: ^2.1.0
  flutter_expanded_tile: ^0.4.0
  go_router: ^14.2.8
  percent_indicator: ^4.2.3
  readmore: ^3.0.0
  flutter_layout_grid: ^2.0.7
  table_calendar: ^3.1.2
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  # firebase_core: ^3.13.0
  flutter_quill: ^11.4.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  get:
  dio:
  flutter_secure_storage:
  file_picker: ^8.0.0
  web: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icons/
    - assets/image/
    - assets/fonts/
    - assets/svg/
    - assets/svg/sidebar/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
